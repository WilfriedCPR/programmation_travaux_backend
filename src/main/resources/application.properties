spring.application.name=ProgrammationTravaux
server.port=8095

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.jackson.serialization.write-dates-as-timestamps=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI}

keycloak.token-url=${KEYCLOAK_TOKEN_URL}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

cors.allowed-origins=${CORS_ORIGINS}
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

spring.main.allow-bean-definition-overriding=true
spring.flyway.enabled=false
spring.servlet.multipart.file-size-threshold=2MB
server.servlet.session.timeout=120m

keycloak.admin-base-url=${KEYCLOAK_ADMIN_BASE_URL:http://localhost:8080}
keycloak.realm-name=${KEYCLOAK_REALM_NAME:programmation-travaux}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=60s