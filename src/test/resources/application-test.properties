spring.datasource.url=jdbc:h2:mem:programmationtravaux;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=ROLE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never
spring.jpa.open-in-view=false
KEYCLOAK_ISSUER_URI=http://localhost:9999/realms/test
KEYCLOAK_JWK_URI=http://localhost:9999/realms/test/protocol/openid-connect/certs
KEYCLOAK_TOKEN_URL=http://localhost:9999/realms/test/protocol/openid-connect/token
KEYCLOAK_CLIENT_ID=test
KEYCLOAK_CLIENT_SECRET=test
CORS_ORIGINS=http://localhost:4200
file.upload-dir=./target/test-uploads
app.vapid.keys-file=./target/test-vapid-keys.properties
app.cookie-secure=false
